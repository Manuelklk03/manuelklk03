<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 104" width="550" height="104" role="img" aria-labelledby="title">
  <title id="title">Manuel Casinos Pérez</title>
  <style>
    .shine { animation: sweep 2.8s linear infinite; }
    @keyframes sweep {
      0% { transform: translateX(-150px); }
      100% { transform: translateX(550px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .shine { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="light">
      <stop stop-color="#64f5b7" stop-opacity="0"/>
      <stop offset=".5" stop-color="#d6ffe9"/>
      <stop offset="1" stop-color="#64f5b7" stop-opacity="0"/>
    </linearGradient>
    <text id="name" x="293" y="61" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="36" font-weight="700">Manuel Casinos Pérez</text>
    <clipPath id="letters"><use href="#name"/></clipPath>
  </defs>
  <rect x="1" y="1" width="548" height="102" rx="13" fill="#101a19" stroke="#24644f" stroke-width="2"/>
  <path d="m28 45 8 7-8 7" fill="none" stroke="#66f5b5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#name" fill="#8ce9bd"/>
  <path d="M69 77H481" stroke="#24644f" stroke-width="2" stroke-linecap="round"/>
  <g clip-path="url(#letters)">
    <rect class="shine" width="145" height="76" fill="url(#light)"/>
  </g>
  <svg x="69" y="76" width="412" height="2">
    <rect class="shine" x="-69" width="145" height="2" fill="url(#light)"/>
  </svg>
</svg>
