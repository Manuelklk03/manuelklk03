  </g>
  <rect x="1" y="1" width="678" height="144" rx="17" fill="none" stroke="#39876f" stroke-width="2"/>
  <rect x="24" y="33" width="72" height="72" rx="12" fill="#0a201b" stroke="#39876f"/>
  <path d="m46 55 14 14-14 14" fill="none" stroke="#79ffbe" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="cursor" d="M67 84h10" stroke="#79ffbe" stroke-width="4" stroke-linecap="round"/>
  <use href="#name" fill="#9beac5"/>
  <g clip-path="url(#letters)"><rect class="scan" y="38" width="180" height="64" fill="url(#shine)"/></g>
